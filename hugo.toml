baseURL = "https://ecosystem-cdp.github.io/docs/"
languageCode = "pt-br"
defaultContentLanguage = "pt"
title = "Data Lake CDP — Documentação PIBIC"
contentDir = "content"
enableEmoji = true
enableGitInfo = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.140.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false
  [[module.mounts]]
    source = "docs"
    target = "content/docs"
  # Publicado em /docs/assets/ para que ../../assets/ nos .md funcione no browser
  [[module.mounts]]
    source = "assets"
    target = "static/docs/assets"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]
  sans_serif_font = "Inter"
  secondary_font = "Inter"
  mono_font = "Fira Code"

  [params.footer]
    copyright = "© :YEAR: Projeto PIBIC — CEFET-MG. Documentação do Data Lake open source na OCI."

  [params.social]
    github = "Ecosystem-CDP"

  [params.docs]
    title = "Documentação CDP — PIBIC"
    contentTitleOnly = true
    darkMode = true
    themeColor = "cyan"
    prism = true
    prismTheme = "lotusdocs"
    repoURL = "https://github.com/Ecosystem-CDP/docs"
    repoBranch = "main"
    editPage = true
    lastMod = true
    lastModRelative = true
    sidebarIcons = true
    breadcrumbs = true
    backToTop = true
    toc = true
    tocMobile = true
    scrollSpy = true
    titleIcon = false
    descriptions = false

  [params.flexsearch]
    enabled = true

  [params.landing]
    draftBanner = true
    draftBannerText = "Documentação não finalizada"

[menu]
  [[menu.primary]]
    name = "Documentação"
    url = "docs/"
    identifier = "docs"
    weight = 10
