name: Deploy Zensical to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare docs assets and brand
        run: bash scripts/prepare-docs.sh

      - name: Check docs assets layout
        run: bash scripts/check-docs-assets.sh

      - name: Check documentation links
        run: bash scripts/check-doc-links.sh

      - name: Build documentation
        run: zensical build --strict --clean

      - name: Ensure .nojekyll in site output
        run: touch public/.nojekyll

      - name: Publish to org root Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: Ecosystem-CDP/ecosystem-cdp.github.io
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
