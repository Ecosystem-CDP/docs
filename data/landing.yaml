# Landing page — Projeto PIBIC (conteúdo novo; documentação em docs/)

hero:
  enable: true
  weight: 10
  template: hero

  backgroundImage:
    path: "images/templates/hero"
    filename:
      desktop: "gradient-desktop.webp"
      mobile: "gradient-mobile.webp"

  badge:
    text: PIBIC
    color: primary
    pill: true
    soft: true

  title: "Data Lake open source na Oracle Cloud"
  subtitle: Documentação oficial do projeto de **Iniciação Científica** para implantação de um cluster **Hadoop/Spark (ODP)** na **OCI**, com deploy automatizado via Terraform e trilho manual didático.

  ctaButton:
    icon: menu_book
    btnText: "Abrir documentação"
    url: "/docs/"
  cta2Button:
    icon: code
    btnText: "Repositório no GitHub"
    url: "https://github.com/Ecosystem-CDP"

  info: "**CEFET-MG** — Plataforma CDP na OCI."

featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: Como navegar nesta documentação
  subtitle: Escolha o caminho conforme o seu objetivo — implantação rápida em produção ou aprendizado passo a passo.

  items:
    - title: Visão geral
      icon: visibility
      description: Objetivo, escopo, glossário e contexto do projeto de pesquisa.
      ctaLink:
        text: Ler
        url: /docs/00%20-%20Visão%20Geral/00-projeto/

    - title: Deploy automatizado (CDP)
      icon: rocket_launch
      description: Terraform, Ansible, OCI Stacks e blueprint Ambari — método recomendado.
      ctaLink:
        text: Começar
        url: /docs/03%20-%20CDP/01-resumo-executivo/

    - title: Trilho manual (OCI + ODP)
      icon: school
      description: Provisionamento manual da infraestrutura e instalação do stack Ambari/ODP.
      ctaLink:
        text: Explorar
        url: /docs/01%20-%20OCI/00-prerequisitos/

    - title: Mermaid e diagramas
      icon: account_tree
      description: Arquitetura, fluxos de automação e topologia do cluster documentados visualmente.
      ctaLink:
        text: Ver arquitetura
        url: /docs/03%20-%20CDP/04-arquitetura-fluxo/

imageText:
  enable: false

imageCompare:
  enable: false
